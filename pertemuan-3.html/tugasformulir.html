        <div class="container">
            <section class="content">

                <h2>Formulir Pendaftaran</h2>
                    <p>Silahkan isi formulir dibawah ini untuk mendaftar</p>

                <form action="method=">
                    <label id="nama-lengkap" for="nama-lengkap">Nama Lengkap:</label><br>
                    <input type="text" name="nama-lengkap" placeholder=""><br>
                    <label id="email" for="email">Email:</label><br>
                    <input type="text" name="email" placeholder=""><br>
                    <label id="password" for="password">Password:</label><br>
                    <input type="text" name="password" placeholder=""><br>
                    <label id="jenis-kelamin" for="jenis-kelamin">Jenis Kelamin:</label><br>
                    <input type="radio" name="jenis-kelamin" value="Laki laki">Laki laki <br>
                    <input type="radio" name="jenis-kelamin" value="Perempuan">Perempuan <br>
                    <label id="Hobi" for="Hobi">Hobi:</label><br>
                    <input type="checkbox" name="hobi" value="musik">Musik<br>
                    <input type="checkbox" name="hobi" value="olahraga">Olahraga<br>
                    <input type="checkbox" name="hobi" value="membaca">Membaca<br>
                    <label id="kota" for="kota">Pilih Kota:</label><br>
                    <select>
                        <option value="1">Jakarta</option>
                        <option value="2">Pekanbaru</option>
                        <option value="3">Karawang</option>
                    </select><br>
                    <label id="pesan-tambahan" for="pesan-tambahan">Pesan Tambahan:</label><br>
                    <textarea name="pesan-tambahan" placeholder="Tuliskan pesanmu disini" rows="4" cols="70"></textarea> <br>
                    <button type="submit" name="Kirim">Kirim</button>
                    
                </form>
            </section>

                <aside class="sidebar">
                        <h2>Sidebar</h2>
                        <p>Bagian Sidebar dapat berisi tautan,iklan, atau informasi tambahan</p>

                </aside>
        </div>

    </body>

</html>
