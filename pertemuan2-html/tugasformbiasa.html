<html>
    <head>
        <title>
            Form Daftar Audisi Bakat 
        </title>
    </head>
         <body>
             <form action="#" method="post">
                    <label id="nama" for="nama-lengkap">Nama :</label>
                    <input type="text" name="nama-lengkap" placeholder=""> <br>
                    <label id="email" for="email">Email :</label>
                    <input type="email" name="email" placeholder=""><br>
                    <label id="jenis-kelamin" for="jenis-kelamin">Jenis Kelamin:</label><br>
                    <input type="radio" name="jenis-kelamin" value="Laki laki">Laki laki 
                    <input type="radio" name="jenis-kelamin" value="Perempuan">Perempuan <br>
                    <label id="hobi" for="hobi">Hobi:</label><br>
                    <input type="checkbox" name="hobi" value="musik">Musik
                    <input type="checkbox" name="hobi" value="olahraga">Olahraga<br>
                    <label id="kota" for="kota">Pilih Kota:</label><br>
                    <select>
                        <option value="1">Jakarta</option>
                        <option value="2">Pekanbaru</option>
                        <option value="3">Karawang</option>
                    </select><br>
                    <label for="file">Upload Foto:</label>
                    <input  type="file" name="file" accept="image/*"> <br>
                    <button type="daftar" name="daftar">Daftar</button>
                    
                </form>
         </body>

</html>
